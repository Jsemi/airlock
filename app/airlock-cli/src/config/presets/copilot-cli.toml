# GitHub Copilot CLI preset
#
# API hosts from:
# https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment

[env]
# The real token stays on the host: the sandbox sees a same-length random
# surrogate, and the `inject` rule below swaps the real value into request
# headers at the host boundary.
COPILOT_GITHUB_TOKEN = { value = "${COPILOT_GITHUB_TOKEN}", mask = true }

# Injection covers every host this rule allows (including the telemetry
# hosts under *.githubcopilot.com) — the token only ever leaves the host in
# requests where Copilot itself put the surrogate.
[network.rules.copilot-cli]
inject = ["COPILOT_GITHUB_TOKEN"]
allow = [
    "github.com:443",
    "api.github.com:443",
    "*.githubcopilot.com:443",
]

[mounts.copilot-session]
source = "~/.airlock/copilot-cli"
target = "~/.copilot"
missing = "create-dir"
