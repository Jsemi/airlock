# OpenAI codex development preset

[env]
# The real API key stays on the host: the sandbox sees a same-length random
# surrogate, and the `inject` rule below swaps the real value into request
# headers at the host boundary.
OPENAI_API_KEY = { value = "${OPENAI_API_KEY}", mask = true }

[network.rules.codex]
inject = ["OPENAI_API_KEY"]
allow = [
    "api.openai.com:443",
    "auth.openai.com:443",
]

[mounts.codex-dir]
source = "~/.airlock/codex"
target = "~/.codex"
missing = "create-dir"
