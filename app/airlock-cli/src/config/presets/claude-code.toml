# Claude code development preset

[env]
# The real token stays on the host: the sandbox sees a same-length random
# surrogate, and the `inject` rule below swaps the real value into request
# headers to the Anthropic API at the host boundary.
CLAUDE_CODE_OAUTH_TOKEN = { value = "${CLAUDE_CODE_OAUTH_TOKEN}", mask = true }
# Tell that we're inside sandbox
IS_SANDBOX = "1"
# Claude uses Node certs - must add airlock CA to the trusted certs
NODE_EXTRA_CA_CERTS = "/etc/ssl/certs/ca-certificates.crt"

[network.rules.claude-code]
inject = ["CLAUDE_CODE_OAUTH_TOKEN"]
allow = [
    "claude.ai:443",
    "downloads.claude.ai:443",
    "platform.claude.com:443",
    "api.anthropic.com:443",
]

[mounts.claude-settings]
missing = "create-dir"
source = "~/.airlock/claude/settings"
target = "~/.claude"

[mounts.claude-json]
missing = "create-file"
file_content = "{\"hasCompletedOnboarding\":true}"
source = "~/.airlock/claude/claude.json"
target = "~/.claude.json"
